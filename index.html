<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluador Inmobiliario - Versión Final con Desglose</title>
    <style>
        :root {
            --primary: #1e3799;
            --secondary: #eb2f06;
            --success: #38ada9;
            --dark: #2f3542;
            --light: #f1f2f6;
        }
        body { font-family: 'Segoe UI', sans-serif; background: #dfe4ea; margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        h1, h2, h3 { text-align: center; color: var(--primary); margin-top: 0; }
        .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px; }
        
        .card { background: var(--light); padding: 20px; border-radius: 10px; border: 1px solid #ced4da; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 0.85em; margin-bottom: 4px; color: #57606f; }
        input, select { width: 100%; padding: 10px; border: 1px solid #a4b0be; border-radius: 6px; box-sizing: border-box; font-size: 0.95em; }
        
        /* Precios dinámicos en los dropdowns */
        .val-preview { display: block; font-size: 0.8em; color: var(--secondary); font-weight: bold; margin-top: 3px; }

        /* Visualizadores */
        .visor-unidad { background: #ffffff; border: 2px solid var(--primary); padding: 15px; border-radius: 10px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; }
        .visor-unidad div { border-right: 1px solid #eee; }
        .visor-unidad div:last-child { border-right: none; }
        .val-unidad { display: block; font-size: 1.1em; font-weight: bold; color: var(--primary); }

        .visualizador-total { background: var(--primary); color: white; padding: 25px; border-radius: 10px; text-align: center; }
        .res-big { font-size: 1.8em; font-weight: bold; color: #fff; margin: 5px 0; }
        
        .badge { display: inline-block; padding: 12px 30px; border-radius: 50px; font-size: 1.3em; font-weight: bold; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .nota-ok { background: var(--success); }
        .nota-alert { background: var(--secondary); }

        .terreno-box { margin-top: 30px; padding: 20px; border: 2px dashed var(--primary); border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Evaluación de Proyecto Inmobiliario</h1>

    <div class="grid-main">
        <div class="card">
            <h3>Gastos Directos</h3>
            <div class="input-group"><label>Costo del Terreno ($)</label><input type="number" id="cTerreno" value="200000000" oninput="calcular()"></div>
            <div class="input-group"><label>Carreteras y Cesión ($)</label><input type="number" id="cCarreteras" value="80000000" oninput="calcular()"></div>
            <div class="input-group"><label>Construcción, Servicios y Amenidades ($)</label><input type="number" id="cConst" value="450000000" oninput="calcular()"></div>
            <div class="input-group"><label>Costos Operativos (Nómina, oficina, atención) ($)</label><input type="number" id="cOp" value="5000000" oninput="calcular()"></div>
            <div class="input-group">
                <label>Valor UVT (Manual)</label>
                <input type="number" id="vUVT" value="52374" oninput="calcular()">
                <small>Notaría (262.5 UVT): <span id="valNotariaTxt" style="font-weight:bold;">$0</span></small>
            </div>
            <div class="input-group">
                <label>Escrituración por Unidad ($)</label>
                <input type="number" id="cEscUni" value="2500000" oninput="calcular()">
            </div>
        </div>

        <div class="card">
            <h3>Gastos Indirectos</h3>
            <div class="input-group">
                <label>Venta Total del Proyecto ($)</label>
                <input type="number" id="vTotal" value="1500000000" oninput="calcular()">
            </div>
            <div class="input-group">
                <label>Número de Unidades</label>
                <input type="number" id="nUni" value="12" oninput="calcular()">
            </div>
            
            <div class="input-group">
                <label>% Publicidad (Sobre Costo Proyecto)</label>
                <select id="pPub" onchange="calcular()">
                    <option value="0.01">1%</option><option value="0.02">2%</option><option value="0.03" selected>3%</option>
                </select>
                <span class="val-preview" id="pre-Pub">$ 0</span>
            </div>

            <div class="input-group">
                <label>% Comisiones de Venta (Sobre Venta)</label>
                <select id="pCom" onchange="calcular()">
                    <option value="0.02">2%</option><option value="0.03" selected>3%</option><option value="0.04">4%</option><option value="0.05">5%</option>
                </select>
                <span class="val-preview" id="pre-Com">$ 0</span>
            </div>

            <div class="input-group">
                <label>% Colchón de Seguridad (Sobre Venta)</label>
                <select id="pCol" onchange="calcular()">
                    <option value="0.03">3%</option><option value="0.05" selected>5%</option><option value="0.07">7%</option><option value="0.10">10%</option>
                </select>
                <span class="val-preview" id="pre-Col">$ 0</span>
            </div>

            <div class="input-group">
                <label>% Ganancia Desarrollador (Sobre Directos)</label>
                <select id="pDes" onchange="calcular()">
                    <option value="0.09">9%</option><option value="0.10">10%</option><option value="0.11">11%</option><option value="0.12" selected>12%</option>
                </select>
                <span class="val-preview" id="pre-Des">$ 0</span>
            </div>
        </div>
    </div>

    <h3>Análisis por Unidad</h3>
    <div class="visor-unidad">
        <div><label>Costo Unidad</label><span class="val-unidad" id="uCosto">$0</span></div>
        <div><label>Venta Unidad</label><span class="val-unidad" id="uVenta">$0</span></div>
        <div><label>Comisión (3%)</label><span class="val-unidad" id="uComision">$0</span></div>
        <div><label>Ganancia Unidad</label><span class="val-unidad" id="uGanancia">$0</span></div>
    </div>

    <div class="visualizador-total">
        <div class="grid-main" style="grid-template-columns: 1fr 1fr 1fr; border:none; margin-bottom:0;">
            <div><p>COSTO PROYECTO</p><div class="res-big" id="tCosto">$0</div></div>
            <div><p>PRECIO VENTA</p><div class="res-big" id="tVenta">$0</div></div>
            <div><p>GANANCIA ANTES IMP.</p><div class="res-big" id="tGanancia">$0</div></div>
        </div>
        <p>MARGEN DE UTILIDAD: <span id="tMargen" style="font-size: 1.8em; font-weight: bold;">0%</span></p>
        <div id="notaFinal" class="badge">Nota: -</div>
    </div>

    <div class="terreno-box">
        <h3>Evaluación Técnica de Terreno</h3>
        <div class="grid-main">
            <div>
                <label>Precio de Venta Terreno ($)</label>
                <input type="number" id="terrVenta" oninput="calcular()">
                <label>Precio Zona (Referencia) ($)</label>
                <input type="number" id="terrRef" oninput="calcular()">
                <p id="terrDiff" style="font-weight: bold; margin-top:10px; color: var(--primary);"></p>
            </div>
            <div style="text-align: center;">
                <label>Ubicación / Preparación</label>
                <div class="grid-main" style="grid-template-columns: 1fr 1fr; gap:10px;">
                    <select id="tUbi" onchange="calcular()">
                        <option value="N">Norte (N)</option><option value="C">Centro (C)</option><option value="S">Sur (S)</option>
                    </select>
                    <select id="tPrep" onchange="calcular()">
                        <option value="-">Requiere Preparación (-)</option><option value="+">No requiere (+)</option>
                    </select>
                </div>
                <div id="califLetras" style="font-size: 3.5em; font-weight: 900; color: var(--primary); margin-top: 10px;">---</div>
            </div>
        </div>
    </div>
</div>

<script>
function calcular() {
    // 1. Datos Directos
    const cTerreno = parseFloat(document.getElementById('cTerreno').value) || 0;
    const cCarreteras = parseFloat(document.getElementById('cCarreteras').value) || 0;
    const cConst = parseFloat(document.getElementById('cConst').value) || 0;
    const cOp = parseFloat(document.getElementById('cOp').value) || 0;
    const uvt = parseFloat(document.getElementById('vUVT').value) || 0;
    const cNotaria = 262.5 * uvt;
    const nUni = parseFloat(document.getElementById('nUni').value) || 1;
    const cEscritTotal = (parseFloat(document.getElementById('cEscUni').value) || 0) / 2 * nUni;

    document.getElementById('valNotariaTxt').innerText = `$ ${cNotaria.toLocaleString()}`;
    const totalDirectos = cTerreno + cCarreteras + cConst + cOp + cNotaria + cEscritTotal;

    // 2. Datos Indirectos y Totales
    const vTotal = parseFloat(document.getElementById('vTotal').value) || 0;
    const pPub = parseFloat(document.getElementById('pPub').value);
    const pCom = parseFloat(document.getElementById('pCom').value);
    const pCol = parseFloat(document.getElementById('pCol').value);
    const pDes = parseFloat(document.getElementById('pDes').value);

    // Cálculos de montos individuales
    const montoComisiones = vTotal * pCom;
    const montoColchon = vTotal * pCol;
    const montoDesarrollador = totalDirectos * pDes;
    
    // Publicidad calculada sobre el total estimado para evitar circularidad
    const montoPublicidad = (totalDirectos + montoComisiones + montoColchon + montoDesarrollador) * pPub;

    // Mostrar valores en las vistas previas de los dropdowns
    document.getElementById('pre-Com').innerText = `$ ${Math.round(montoComisiones).toLocaleString()}`;
    document.getElementById('pre-Col').innerText = `$ ${Math.round(montoColchon).toLocaleString()}`;
    document.getElementById('pre-Des').innerText = `$ ${Math.round(montoDesarrollador).toLocaleString()}`;
    document.getElementById('pre-Pub').innerText = `$ ${Math.round(montoPublicidad).toLocaleString()}`;

    const costoProyecto = totalDirectos + montoPublicidad + montoComisiones + montoColchon + montoDesarrollador;
    const gananciaAbs = vTotal - costoProyecto;
    const margenPct = (vTotal > 0) ? (gananciaAbs / vTotal) * 100 : 0;

    // 3. Visualizador por Unidad
    const uCostoVal = costoProyecto / nUni;
    const uVentaVal = vTotal / nUni;
    const uComisionVal = uVentaVal * 0.03; // 3% fijo según instrucción
    const uGananciaVal = uVentaVal - uCostoVal;

    document.getElementById('uCosto').innerText = `$ ${Math.round(uCostoVal).toLocaleString()}`;
    document.getElementById('uVenta').innerText = `$ ${Math.round(uVentaVal).toLocaleString()}`;
    document.getElementById('uComision').innerText = `$ ${Math.round(uComisionVal).toLocaleString()}`;
    document.getElementById('uGanancia').innerText = `$ ${Math.round(uGananciaVal).toLocaleString()}`;

    // 4. Visualizador Total
    document.getElementById('tCosto').innerText = `$ ${Math.round(costoProyecto).toLocaleString()}`;
    document.getElementById('tVenta').innerText = `$ ${Math.round(vTotal).toLocaleString()}`;
    document.getElementById('tGanancia').innerText = `$ ${Math.round(gananciaAbs).toLocaleString()}`;
    document.getElementById('tMargen').innerText = `${margenPct.toFixed(2)}%`;

    // Calificación Proyecto (1-10)
    let nota = 1;
    if (margenPct >= 50) nota = 10;
    else if (margenPct >= 40) nota = 9;
    else if (margenPct >= 35) nota = 8;
    else if (margenPct >= 30) nota = 7;
    else if (margenPct >= 25) nota = 6;
    else if (margenPct >= 20) nota = 5;
    else if (margenPct >= 15) nota = 4;
    else if (margenPct >= 10) nota = 3;
    else if (margenPct >= 5) nota = 2;

    const badge = document.getElementById('notaFinal');
    badge.innerText = `Calificación Final: ${nota} / 10`;
    badge.className = `badge ${nota >= 7 ? 'nota-ok' : 'nota-alert'}`;

    // 5. Evaluación de Terreno
    const tVentaInput = parseFloat(document.getElementById('terrVenta').value) || 0;
    const tRefInput = parseFloat(document.getElementById('terrRef').value) || 0;
    if (tRefInput > 0) {
        const dP = tRefInput - tVentaInput;
        const dPct = (dP / tRefInput) * 100;
        document.getElementById('terrDiff').innerText = `Ahorro vs Zona: $${dP.toLocaleString()} (${dPct.toFixed(1)}%)`;
    }

    let viabilidad = "B";
    const pctTerrSobreCosto = (cTerreno / costoProyecto) * 100;
    if (pctTerrSobreCosto < 12) viabilidad = "AAA";
    else if (pctTerrSobreCosto < 15) viabilidad = "AA";
    else if (pctTerrSobreCosto === 15) viabilidad = "A";

    document.getElementById('califLetras').innerText = document.getElementById('tUbi').value + viabilidad + document.getElementById('tPrep').value;
}

// Cálculo inicial
calcular();
</script>

</body>
</html>
